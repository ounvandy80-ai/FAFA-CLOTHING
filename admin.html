<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAFA Clothing - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- 🔐 ផ្ទាំង Login សម្រាប់ផ្ទៀងផ្ទាត់ Gmail -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96 text-center">
            <h2 class="text-2xl font-bold text-indigo-600 mb-2">🔒 Admin Login</h2>
            <p class="text-gray-500 text-sm mb-6">សូមបញ្ចូលពាក្យសម្ងាត់របស់អ្នកដើម្បីចូលកាន់ប្រព័ន្ធ</p>
            <input type="email" id="adminEmailInput" placeholder="Password" class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="checkAdminLogin()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">ចូលកាន់ប្រព័ន្ធ</button>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden">ពាក្យសម្ងាត់មិនត្រឹមត្រូវ! អ្នកមិនមានសិទ្ធិចូលទេ។</p>
        </div>
    </div>

    <!-- 🛠️ ផ្ទាំង Admin Panel ដើម (នឹងបង្ហាញលុះត្រាតែ Login ត្រូវ) -->
    <div id="adminContent" class="hidden">
        <header class="bg-indigo-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">🛠️ FAFA Clothing - Admin Panel</h1>
            <button onclick="logoutAdmin()" class="bg-red-500 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-red-600 transition">ចាកចេញ (Logout)</button>
        </header>

        <main class="max-w-5xl mx-auto p-6">
            <!-- បន្ថែមផលិតផលថ្មី -->
            <div class="bg-white p-6 rounded-xl shadow-md mb-8">
                <h2 class="text-lg font-bold text-gray-700 mb-4">➕ បន្ថែមផលិតផលថ្មី</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="number" id="newId" placeholder="ID (ឧទាហរណ៍: 9, 10...)" class="border p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" id="newName" placeholder="ឈ្មោះផលិតផល" class="border p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="number" id="newPrice" placeholder="តម្លៃ ($)" step="0.01" class="border p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="number" id="newStock" placeholder="ចំនួនស្តុក (Stock)" class="border p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" id="newImage" placeholder="លីងរូបភាព (Image URL)" class="border p-2.5 rounded-lg col-span-1 md:col-span-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button onclick="addProduct()" class="mt-4 w-full bg-green-600 text-white py-2.5 rounded-lg font-semibold hover:bg-green-700 transition">រក្សាទុកផលិតផលថ្មី</button>
            </div>

            <!-- គ្រប់គ្រងស្តុកផលិតផលដែលមានស្រាប់ -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-bold text-gray-700 mb-4">📦 គ្រប់គ្រងស្តុកផលិតផលស្រាប់</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 border-b">
                                <th class="p-3">រូបភាព</th>
                                <th class="p-3">ឈ្មោះ</th>
                                <th class="p-3">តម្លៃ</th>
                                <th class="p-3">ស្តុកបច្ចុប្បន្ន</th>
                                <th class="p-3 text-center">សកម្មភាព</th>
                            </tr>
                        </thead>
                        <tbody id="productList">
                            <!-- ទិន្នន័យទាញមកបង្ហាញដោយ JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const BACKEND_URL = 'https://fafa-backend.onrender.com'; // Link Server Render របស់បង
        const OWNER_EMAIL = 'Vandy25012003'; // អ៊ីមែលដែលអនុញ្ញាតឱ្យចូល

        // ពិនិត្យមើលថាតើធ្លាប់ Login រួចរាល់ហើយឬยังពេលបើក Page
        window.onload = function() {
            let loggedUser = localStorage.getItem('admin_email');
            if (loggedUser === OWNER_EMAIL) {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadProducts();
            }
        }

        // មុខងារផ្ទៀងផ្ទាត់ពេលចុច Login
        function checkAdminLogin() {
            let inputEmail = document.getElementById('adminEmailInput').value.trim();
            if (inputEmail === OWNER_EMAIL) {
                localStorage.setItem('admin_email', OWNER_EMAIL);
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadProducts();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        // មុខងារ Logout ចាកចេញ
        function logoutAdmin() {
            localStorage.removeItem('admin_email');
            location.reload();
        }

        // ទាញយកទិន្នន័យផលិតផលមកបង្ហាញ
        async function loadProducts() {
            try {
                let res = await fetch(`${BACKEND_URL}/api/products`);
                let products = await res.json();
                let listHtml = '';

                products.forEach(p => {
                    listHtml += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3"><img src="${p.image}" class="w-12 h-12 object-cover rounded"></td>
                            <td class="p-3 font-medium text-gray-800">${p.name} (ID: ${p.id})</td>
                            <td class="p-3 text-blue-600 font-semibold">$${p.price}</td>
                            <td class="p-3">
                                <input type="number" id="stock-${p.id}" value="${p.stock}" class="w-20 border p-1.5 rounded text-center">
                            </td>
                            <td class="p-3 text-center space-x-2">
                                <button onclick="updateStock(${p.id})" class="bg-indigo-600 text-white px-3 py-1 rounded text-sm hover:bg-indigo-700 transition">កែស្តុក</button>
                                <button onclick="deleteProduct(${p.id})" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 transition">លុប</button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById('productList').innerHTML = listHtml;
            } catch (err) {
                console.error("Error loading products:", err);
            }
        }

        // កែស្តុក
        async function updateStock(id) {
            let newStock = document.getElementById(`stock-${id}`).value;
            let res = await fetch(`${BACKEND_URL}/api/admin/update-stock`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: Number(id), stock: Number(newStock) })
            });
            let data = await res.json();
            if (data.success) {
                alert('កែស្តុកបានជោគជ័យ!');
                loadProducts();
            } else {
                alert('បរាជ័យ: ' + data.message);
            }
        }

        // បន្ថែមផលិតផលថ្មី
        async function addProduct() {
            let id = document.getElementById('newId').value;
            let name = document.getElementById('newName').value;
            let price = document.getElementById('newPrice').value;
            let stock = document.getElementById('newStock').value;
            let image = document.getElementById('newImage').value;

            if (!id || !name || !price || !stock || !image) {
                alert('សូមបំពេញព័ត៌មានឱ្យបានគ្រប់គ្រាន់!');
                return;
            }

            let res = await fetch(`${BACKEND_URL}/api/admin/add-product`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: Number(id), name, price: Number(price), stock: Number(stock), image })
            });
            let data = await res.json();
            if (data.success) {
                alert('បានបន្ថែមផលិតផលថ្មីដោយជោគជ័យ!');
                location.reload();
            } else {
                alert('បរាជ័យ: ' + data.message);
            }
        }

        // លុបផលិតផល
        async function deleteProduct(id) {
            if (!confirm('តើអ្នកពិតជាចង់លុបផលិតផលនេះមែនទេ?')) return;
            let res = await fetch(`${BACKEND_URL}/api/admin/delete-product/${id}`, {
                method: 'DELETE'
            });
            let data = await res.json();
            if (data.success) {
                alert('លុបបានជោគជ័យ!');
                loadProducts();
            } else {
                alert('បរាជ័យ: ' + data.message);
            }
        }
    </script>
</body>
</html>
