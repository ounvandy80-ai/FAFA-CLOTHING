<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAFA Clothing - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">🛠️ FAFA Clothing - Admin Panel</h1>
        <a href="index.html" class="bg-white text-indigo-600 px-3 py-1.5 rounded text-xs font-semibold hover:bg-gray-100">ទៅកាន់ហាងវិញ</a>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        
        <!-- 📦 ផ្នែកបន្ថែមផលិតផលថ្មី -->
        <div class="bg-white p-5 rounded-lg shadow-sm border">
            <h2 class="text-base font-bold text-indigo-600 mb-3">➕ បន្ថែមផលិតផលថ្មី</h2>
            <form id="add-product-form" onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="number" id="new-id" placeholder="ID (ឧទាហរណ៍: 9, 10...)" class="border p-2 rounded text-xs" required>
                <input type="text" id="new-name" placeholder="ឈ្មោះផលិតផល" class="border p-2 rounded text-xs" required>
                <input type="number" step="0.01" id="new-price" placeholder="តម្លៃ ($)" class="border p-2 rounded text-xs" required>
                <input type="number" id="new-stock" placeholder="ចំនួនស្តុក (Stock)" class="border p-2 rounded text-xs" required>
                <input type="url" id="new-image" placeholder="ลิงก์រូបភាព (Image URL)" class="border p-2 rounded text-xs md:col-span-2" required>
                <button type="submit" class="bg-indigo-600 text-white py-2 rounded text-xs font-semibold hover:bg-indigo-700 md:col-span-2">រក្សាទុកផលិតផលថ្មី</button>
            </form>
        </div>

        <!-- 📋 បញ្ជីផលិតផលនិងកែប្រែស្តុក -->
        <div class="bg-white p-5 rounded-lg shadow-sm border">
            <h2 class="text-base font-bold text-indigo-600 mb-3">📦 គ្រប់គ្រងស្តុកផលិតផលស្រាប់</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-gray-100 border-b">
                            <th class="p-2">រូបភាព</th>
                            <th class="p-2">ឈ្មោះ</th>
                            <th class="p-2">តម្លៃ</th>
                            <th class="p-2">ស្តុកបច្ចុប្បន្ន</th>
                            <th class="p-2 text-center">សកម្មភាព</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-list">
                        <tr><td colspan="5" class="text-center p-4 text-gray-400">កំពុងទាញយកទំនិញ...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const BACKEND_URL = 'https://fafa-backend.onrender.com';

        // ទាញយកផលិតផលមកបង្ហាញ
        async function fetchAdminProducts() {
            try {
                let res = await fetch(`${BACKEND_URL}/api/products`);
                let products = await res.json();
                let tbody = document.getElementById('admin-product-list');

                if (products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-gray-400">មិនមានផលិតផលទេ</td></tr>';
                    return;
                }

                tbody.innerHTML = products.map(p => `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2"><img src="${p.image}" class="w-10 h-10 object-cover rounded"></td>
                        <td class="p-2 font-medium">${p.name} (ID: ${p.id})</td>
                        <td class="p-2 text-indigo-600 font-bold">$${p.price.toFixed(2)}</td>
                        <td class="p-2">
                            <input type="number" id="stock-${p.id}" value="${p.stock}" class="border w-16 p-1 rounded text-center">
                        </td>
                        <td class="p-2 text-center space-x-1">
                            <button onclick="updateStock(${p.id})" class="bg-green-600 text-white px-2.5 py-1 rounded hover:bg-green-700">កែស្តុក</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-500 text-white px-2.5 py-1 rounded hover:bg-red-600">លុប</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
                alert('បរាជ័យក្នុងការទាញទិន្នន័យ!');
            }
        }

        // កែស្តុកផលិតផល
        async function updateStock(id) {
            let newStock = parseInt(document.getElementById(`stock-${id}`).value);
            try {
                let res = await fetch(`${BACKEND_URL}/api/admin/update-stock`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, stock: newStock })
                });
                let result = await res.json();
                if (result.success) {
                    alert('✅ កែស្តុកបានដោយជោគជ័យ!');
                    fetchAdminProducts();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ Server!');
            }
        }

        // បន្ថែមផលិតផលថ្មី
        async function addProduct(e) {
            e.preventDefault();
            let newProduct = {
                id: parseInt(document.getElementById('new-id').value),
                name: document.getElementById('new-name').value,
                price: parseFloat(document.getElementById('new-price').value),
                stock: parseInt(document.getElementById('new-stock').value),
                image: document.getElementById('new-image').value
            };

            try {
                let res = await fetch(`${BACKEND_URL}/api/admin/add-product`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });
                let result = await res.json();
                if (result.success) {
                    alert('🎉 បន្ថែមផលិតផលថ្មីបានជោគជ័យ!');
                    document.getElementById('add-product-form').reset();
                    fetchAdminProducts();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ Server!');
            }
        }

        // លុបផលិតផល
        async function deleteProduct(id) {
            if (!confirm('តើអ្នកពិតជាចង់លុបផលិតផលនេះមែនទេ?')) return;
            try {
                let res = await fetch(`${BACKEND_URL}/api/admin/delete-product/${id}`, { method: 'DELETE' });
                let result = await res.json();
                if (result.success) {
                    alert('🗑️ លុបបានដោយជោគជ័យ!');
                    fetchAdminProducts();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ Server!');
            }
        }

        fetchAdminProducts();
    </script>
</body>
</html>
