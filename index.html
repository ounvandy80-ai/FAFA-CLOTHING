<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAFA Clothing</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <header class="bg-white shadow-sm sticky top-0 z-10 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-600">👗 FAFA Clothing</h1>
        <div class="flex items-center gap-2">
            <button onclick="openHistoryModal()" class="bg-gray-100 text-indigo-600 px-3 py-1.5 rounded-full text-sm font-medium border border-indigo-200">📦 ប្រវត្តិ</button>
            <button onclick="toggleCart()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-full text-sm font-medium flex items-center gap-1">🛒 កន្ត្រក (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <h2 class="text-lg font-semibold mb-3">ផលិតផលទាំងអស់</h2>
        <div id="product-grid" class="grid grid-cols-2 gap-4">
            <p class="text-xs text-gray-400 col-span-2 text-center py-4">កំពុងទាញយកទំនិញ...</p>
        </div>
    </main>

    <!-- Product Detail & Color Selection Modal -->
    <div id="product-detail-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl relative my-auto">
            <button onclick="closeDetailModal()" class="absolute top-3 right-4 text-gray-400 hover:text-gray-700 text-2xl font-bold">&times;</button>
            
            <div class="text-center">
                <!-- រូបភាពធំបង្ហាញពេញតាមទំហំដើមពិតប្រាកដ មិនកាត់ (Crop) គែមឡើយ -->
                <img id="detail-img" src="" alt="Product" class="w-full h-auto max-h-[320px] object-contain rounded-xl mb-3 border shadow-sm bg-gray-50">
                <h3 id="detail-name" class="font-bold text-sm text-gray-800"></h3>
                <p id="detail-price" class="text-indigo-600 font-bold text-base mt-1"></p>
                <p class="text-xs text-gray-500 mt-1">ស្តុកពណ៌នេះ: <strong id="stock-val" class="text-green-600">0</strong></p>
            </div>

            <div class="mt-4">
                <label class="block text-xs font-semibold text-gray-600 mb-2">🎨 ជ្រើសរើសពណ៌:</label>
                <div id="color-options" class="flex gap-2 flex-wrap"></div>
            </div>

            <div class="mt-6">
                <button id="add-to-cart-btn" onclick="addSelectedToCart()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold text-xs hover:bg-indigo-700 transition">
                    បញ្ជូលទៅក្នុងកន្ត្រក 🛒
                </button>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-sm h-full p-4 flex flex-col justify-between shadow-xl">
            <div>
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-lg font-bold text-indigo-600">📦 ប្រវត្តិការបញ្ជាទិញ</h2>
                    <button onclick="closeHistoryModal()" class="text-gray-500 font-bold text-xl">&times;</button>
                </div>
                <div id="history-items" class="py-3 space-y-3 overflow-y-auto max-h-[75vh]"></div>
            </div>
            <button onclick="closeHistoryModal()" class="w-full bg-gray-200 text-gray-700 py-2 rounded font-semibold text-xs">បិទ</button>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs p-5 rounded-xl shadow-2xl text-center flex flex-col items-center">
            <h3 class="text-base font-bold text-indigo-600 mb-1">ស្កេនបង់ប្រាក់ qua ABA KHQR</h3>
            <p class="text-[11px] text-gray-600 mb-2">ឈ្មោះ: <strong class="text-black">SRY VANDY</strong><br>លេខគណនី: <strong class="text-indigo-600">500258373</strong></p>
            
            <div class="bg-white p-2 rounded-lg border mb-3 w-48 h-48 flex items-center justify-center shadow-inner">
                <img src="https://i.postimg.cc/XNmvLHTr/6c99554f-f27b-4c3a-9e91-a202a0e24eaa.jpg" alt="ABA QR" class="w-full h-full object-contain">
            </div>

            <p class="text-xs font-semibold mb-2">ទឹកប្រាក់សរុប: <span id="qr-amount" class="text-indigo-600 font-bold text-sm"></span></p>

            <button onclick="confirmPayment()" id="confirm-pay-btn" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold text-xs mb-2">បានបង់ប្រាក់រួចរាល់</button>
            <button onclick="closeQrModal()" class="w-full bg-gray-200 text-gray-700 py-1.5 rounded-lg font-semibold text-xs">បោះបង់</button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-sm h-full p-4 flex flex-col justify-between shadow-xl overflow-y-auto">
            <div>
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-lg font-bold">កន្ត្រកទំនិញ</h2>
                    <button onclick="toggleCart()" class="text-gray-500 font-bold text-xl">&times;</button>
                </div>
                
                <div id="cart-items" class="py-3 space-y-2 border-b max-h-[30vh] overflow-y-auto"></div>

                <div class="mt-3 space-y-2">
                    <h3 class="font-bold text-xs text-indigo-600">ព័ត៌មានអ្នកទទួល</h3>
                    <input type="text" id="cus-name" placeholder="ឈ្មោះអ្នកទទួល" class="w-full border rounded px-3 py-1.5 text-xs">
                    <input type="text" id="cus-phone" placeholder="លេខទូរសព្ទ" class="w-full border rounded px-3 py-1.5 text-xs">
                    <textarea id="cus-address" rows="2" placeholder="ទីតាំងអ្នកទទួល" class="w-full border rounded px-3 py-1.5 text-xs"></textarea>
                    
                    <label class="block text-[11px] font-semibold text-gray-600 mt-1">សេវាដឹកជញ្ជូន:</label>
                    <select id="shipping-option" onchange="updateCartUI()" class="w-full border rounded px-3 py-1.5 text-xs bg-white">
                        <option value="2.00">metfone express (+ $2.00)</option>
                        <option value="2.00">J&T Express (+ $2.00)</option>
                        <option value="2.00">វីរៈប៊ុនថាំ VET (+ $2.00)</option>
                        <option value="0.00">ក្រុងប៉ោយប៉ែត FREE ($0.00)</option>
                    </select>
                </div>
            </div>

            <div class="border-t pt-2 mt-3">
                <div class="flex justify-between font-bold text-xs mb-2">
                    <span>សរុបទឹកប្រាក់:</span>
                    <span id="total-price" class="text-indigo-600">$0.00</span>
                </div>
                <button onclick="startCheckoutProcess()" id="checkout-btn" class="w-full bg-green-600 text-white py-2 rounded font-semibold text-xs">បង់ប្រាក់តាម ABA KHQR</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let telegramId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'test_user_vandy';
        let userName = tg.initDataUnsafe?.user?.first_name || 'Guest';

        let currentTranId = null;
        let products = [];
        let cart = [];
        let selectedProductForDetail = null;
        let selectedColorObj = null;

        async function pingServer() {
            try {
                await fetch('https://fafa-backend.onrender.com/api/user/ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, name: userName })
                });
            } catch (e) { console.error(e); }
        }
        pingServer();
        setInterval(pingServer, 30000);

        async function fetchProducts() {
            try {
                let res = await fetch('https://fafa-backend.onrender.com/api/products');
                products = await res.json();
                renderProducts();
            } catch (err) { console.error(err); }
        }

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="bg-white rounded-lg shadow-sm overflow-hidden border flex flex-col justify-between cursor-pointer" onclick="openProductDetail(${p.id})">
                    <img src="${p.image}" class="w-full h-32 object-cover hover:opacity-95 transition">
                    <div class="p-2 flex flex-col justify-between flex-grow">
                        <h3 class="text-xs font-medium">${p.name}</h3>
                        <p class="text-indigo-600 font-bold text-xs mt-1">$${p.price.toFixed(2)}</p>
                        <div class="text-[10px] mt-1 mb-1">
                            ${p.stock > 0 ? `<span class="text-gray-500">ស្តុកសរុប: <strong class="text-green-600">${p.stock}</strong></span>` : `<span class="text-red-500 font-bold">អស់ស្តុក</span>`}
                        </div>
                        <span class="text-center py-1 rounded text-[10px] font-semibold bg-indigo-50 text-indigo-600">ជ្រើសរើសពណ៌</span>
                    </div>
                </div>
            `).join('');
        }

        function openProductDetail(id) {
            let p = products.find(item => item.id === id);
            if (!p) return;
            selectedProductForDetail = p;

            document.getElementById('detail-name').innerText = p.name;
            document.getElementById('detail-price').innerText = `$${p.price.toFixed(2)}`;

            let colorsContainer = document.getElementById('color-options');
            if (p.colors && p.colors.length > 0) {
                selectedColorObj = p.colors[0];
                document.getElementById('detail-img').src = selectedColorObj.image; 
                document.getElementById('stock-val').innerText = selectedColorObj.stock || 0;
                
                colorsContainer.innerHTML = p.colors.map((c, index) => `
                    <button onclick="selectColor('${c.image}', '${c.colorName}', ${c.stock || 0}, this)" class="color-btn border-2 p-1.5 rounded-xl flex items-center gap-1.5 text-xs transition ${index === 0 ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200'}">
                        <img src="${c.image}" class="w-8 h-8 object-cover rounded-lg">
                        <div class="text-left">
                            <p class="font-medium">${c.colorName}</p>
                            <p class="text-[10px] ${c.stock > 0 ? 'text-green-600' : 'text-red-500'}">ស្តុក: ${c.stock || 0}</p>
                        </div>
                    </button>
                `).join('');
            } else {
                selectedColorObj = { colorName: 'ស្តង់ដារ', stock: p.stock };
                document.getElementById('detail-img').src = p.image;
                document.getElementById('stock-val').innerText = p.stock;
                colorsContainer.innerHTML = `<span class="text-xs text-gray-500">គ្មានជម្រើសពណ៌ផ្សេងទេ</span>`;
            }

            checkStockAndToggleButton();
            document.getElementById('product-detail-modal').classList.remove('hidden');
        }

        function selectColor(imgUrl, colorName, colorStock, btnElement) {
            document.getElementById('detail-img').src = imgUrl;
            selectedColorObj = { colorName, stock: colorStock };
            document.getElementById('stock-val').innerText = colorStock;

            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('border-indigo-600', 'bg-indigo-50'));
            btnElement.classList.add('border-indigo-600', 'bg-indigo-50');

            checkStockAndToggleButton();
        }

        function checkStockAndToggleButton() {
            let btn = document.getElementById('add-to-cart-btn');
            if (selectedColorObj.stock <= 0) {
                btn.innerText = "អស់ស្តុកហើយ ❌";
                btn.disabled = true;
                btn.className = "w-full bg-gray-300 text-gray-500 py-2.5 rounded-xl font-semibold text-xs cursor-not-allowed";
            } else {
                btn.innerText = "បញ្ជូលទៅក្នុងកន្ត្រក 🛒";
                btn.disabled = false;
                btn.className = "w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold text-xs hover:bg-indigo-700 transition";
            }
        }

        function closeDetailModal() { document.getElementById('product-detail-modal').classList.add('hidden'); }

        function addSelectedToCart() {
            if (!selectedProductForDetail || !selectedColorObj) return;
            let p = selectedProductForDetail;

            if (selectedColorObj.stock <= 0) { alert('⚠️ ពណ៌នេះអស់ស្តុកហើយ!'); return; }

            let exist = cart.find(item => item.id === p.id && item.selectedColor === selectedColorObj.colorName);
            let currentInCart = exist ? exist.quantity : 0;

            if (currentInCart >= selectedColorObj.stock) {
                alert(`⚠️ លើសចំនួនស្តុកដែលមានសម្រាប់ពណ៌ ${selectedColorObj.colorName} នេះហើយ!`);
                return;
            }

            if (exist) { exist.quantity++; } 
            else { cart.push({ ...p, image: selectedColorObj.image, quantity: 1, selectedColor: selectedColorObj.colorName }); }

            closeDetailModal();
            updateCartUI();
            alert(`បានបន្ថែម ${p.name} (ពណ៌: ${selectedColorObj.colorName}) ចូលកន្ត្រកជោគជ័យ!`);
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.quantity, 0);
            let container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center text-xs py-2">កន្ត្រកទទេ</p>';
                document.getElementById('total-price').innerText = '$0.00';
                return;
            }
            container.innerHTML = cart.map(i => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded text-xs">
                    <div class="flex items-center gap-2">
                        <img src="${i.image}" class="w-10 h-10 object-cover rounded">
                        <div>
                            <p class="font-bold">${i.name}</p>
                            <p class="text-gray-500 text-[10px]">ពណ៌: ${i.selectedColor} | $${i.price} x ${i.quantity}</p>
                        </div>
                    </div>
                    <button onclick="removeItem(${i.id}, '${i.selectedColor}')" class="text-red-500 font-bold px-2">លុប</button>
                </div>
            `).join('');

            let subtotal = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            let shippingFee = parseFloat(document.getElementById('shipping-option').value) || 0;
            document.getElementById('total-price').innerText = `$${(subtotal + shippingFee).toFixed(2)}`;
        }

        function removeItem(id, color) {
            cart = cart.filter(i => !(i.id === id && i.selectedColor === color));
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            updateCartUI();
        }

        async function openHistoryModal() {
            document.getElementById('history-modal').classList.remove('hidden');
            let container = document.getElementById('history-items');
            container.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">កំពុងទាញយក...</p>';

            try {
                let res = await fetch(`https://fafa-backend.onrender.com/api/orders/${telegramId}`);
                let orders = await res.json();
                if (orders.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">មិនទាន់មានប្រវត្តិទិញទេ</p>';
                    return;
                }
                container.innerHTML = orders.map(o => `
                    <div class="bg-gray-50 p-3 rounded-lg border text-xs space-y-1">
                        <div class="flex justify-between font-bold text-indigo-600">
                            <span>កូដ: ${o.orderId}</span>
                            ${o.status === 'PAID' ? '<span class="text-green-600">✅ បានអនុម័ត</span>' : o.status === 'REJECTED' ? '<span class="text-red-500">❌ បដិសេធ</span>' : '<span class="text-yellow-600">⏳ រង់ចាំពិនិត្យ</span>'}
                        </div>
                        <p class="text-[11px] text-gray-500">ថ្ងៃទី: ${o.date}</p>
                        <div class="border-t pt-1 mt-1 space-y-1">
                            ${o.cart.map(i => `<p>• ${i.name} ${i.selectedColor ? `(ពណ៌: ${i.selectedColor})` : ''} ($${i.price} x ${i.quantity})</p>`).join('')}
                        </div>
                        <div class="border-t pt-1 mt-1 font-semibold flex justify-between">
                            <span>សរុប:</span>
                            <span class="text-indigo-600">$${o.amount}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) { console.error(err); }
        }

        function closeHistoryModal() { document.getElementById('history-modal').classList.add('hidden'); }

        async function startCheckoutProcess() {
            if (cart.length === 0) { alert('សូមជ្រើសរើសទំនិញ!'); return; }
            let name = document.getElementById('cus-name').value.trim();
            let phone = document.getElementById('cus-phone').value.trim();
            let address = document.getElementById('cus-address').value.trim();
            if (!name || !phone || !address) { alert('សូមបំពេញព័ត៌មានឱ្យបានគ្រប់គ្រាន់!'); return; }

            let location = null;
            if (navigator.geolocation) {
                try {
                    let position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
                    });
                    location = { lat: position.coords.latitude, lng: position.coords.longitude };
                } catch (e) { console.log("Location access denied"); }
            }

            let subtotal = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            let shippingFee = parseFloat(document.getElementById('shipping-option').value) || 0;
            let shippingName = document.getElementById('shipping-option').selectedOptions[0].text;
            let totalAmount = (subtotal + shippingFee).toFixed(2);
            let orderId = 'FAFA-' + Date.now();

            try {
                await fetch('https://fafa-backend.onrender.com/api/user/ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, name, phone })
                });

                let res = await fetch('https://fafa-backend.onrender.com/api/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, orderId, amount: totalAmount, name, phone, address, location, shippingFee, shippingName, cart })
                });
                let result = await res.json();
                
                if (!result.success) {
                    alert('⚠️ ' + result.message);
                    return;
                }

                currentTranId = result.tran_id;
                document.getElementById('qr-amount').innerText = `$${totalAmount}`;
                document.getElementById('qr-modal').classList.remove('hidden');
                toggleCart();
            } catch (err) { console.error(err); }
        }

        async function confirmPayment() {
            try {
                let res = await fetch('https://fafa-backend.onrender.com/api/confirm-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tran_id: currentTranId })
                });
                let result = await res.json();
                if (result.success) {
                    cart = [];
                    alert('🎉 បានបញ្ជូនការបញ្ជាទិញរួចរាល់! រង់ចាំ Admin ពិនិត្យ។');
                    document.getElementById('qr-modal').classList.add('hidden');
                    updateCartUI();
                }
            } catch (err) { console.error(err); }
        }

        function closeQrModal() { document.getElementById('qr-modal').classList.add('hidden'); }

        fetchProducts();
    </script>
</body>
</html>
