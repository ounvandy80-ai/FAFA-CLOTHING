<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAFA Clothing</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-600">👗 FAFA Clothing</h1>
        <button onclick="toggleCart()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-full text-sm font-medium flex items-center gap-1">
            🛒 កន្ត្រក (<span id="cart-count">0</span>)
        </button>
    </header>

    <!-- Product Grid -->
    <main class="p-4 max-w-md mx-auto">
        <h2 class="text-lg font-semibold mb-3">ផលិតផលទាំងអស់</h2>
        <div id="product-grid" class="grid grid-cols-2 gap-4">
            <p class="text-xs text-gray-400 col-span-2 text-center py-4">កំពុងទាញយកទំនិញ...</p>
        </div>
    </main>

    <!-- Modal រូបភាពធំ -->
    <div id="image-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4 cursor-pointer" onclick="closeImageModal()">
        <div class="relative max-w-sm w-full flex justify-center">
            <img id="modal-img" src="" alt="Large View" class="max-h-[80vh] w-auto rounded-lg shadow-2xl object-contain">
            <span class="absolute top-2 right-4 text-white text-3xl font-bold">&times;</span>
        </div>
    </div>

    <!-- QR Code Payment Modal -->
    <div id="qr-modal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs p-5 rounded-xl shadow-2xl text-center flex flex-col items-center">
            <h3 class="text-base font-bold text-indigo-600 mb-1">ស្កេនបង់ប្រាក់ qua ABA KHQR</h3>
            <p class="text-[11px] text-gray-600 mb-2">ឈ្មោះ: <strong class="text-black">SRY VANDY</strong><br>លេខគណនី: <strong class="text-indigo-600">500258373</strong></p>
            
            <div id="qr-container" class="bg-white p-2 rounded-lg border mb-3 w-48 h-48 flex items-center justify-center shadow-inner">
                <!-- 🟢 ដាក់ Link រូបភាព QR Code របស់អ្នកនៅត្រង់ src នេះ -->
                <img id="qr-image-tag" src="https://i.postimg.cc/XNmvLHTr/6c99554f-f27b-4c3a-9e91-a202a0e24eaa.jpg" alt="ABA QR Code" class="w-full h-full object-contain">
            </div>

            <p class="text-xs font-semibold mb-2">ទឹកប្រាក់សរុប: <span id="qr-amount" class="text-indigo-600 font-bold text-sm"></span></p>

            <button onclick="confirmPayment()" id="confirm-pay-btn" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold text-xs hover:bg-green-700 mb-2">
                បានបង់ប្រាក់រួចរាល់ (បញ្ជាក់ការបញ្ជាទិញ)
            </button>
            <button onclick="closeQrModal()" class="w-full bg-gray-200 text-gray-700 py-1.5 rounded-lg font-semibold text-xs hover:bg-gray-300">
                បោះបង់
            </button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-sm h-full p-4 flex flex-col justify-between shadow-xl overflow-y-auto">
            <div>
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-lg font-bold">កន្ត្រកទំនិញ</h2>
                    <button onclick="toggleCart()" class="text-gray-500 font-bold text-xl">&times;</button>
                </div>
                
                <div id="cart-items" class="py-3 space-y-2 border-b max-h-[35vh] overflow-y-auto"></div>

                <!-- Form ព័ត៌មាន -->
                <div class="mt-3 space-y-2">
                    <h3 class="font-bold text-xs text-indigo-600">ព័ត៌មានអ្នកទទួល</h3>
                    <input type="text" id="cus-phone" placeholder="លេខទូរសព្ទ (Phone Number)" class="w-full border rounded px-3 py-1.5 text-xs">
                    <textarea id="cus-address" rows="2" placeholder="ទីតាំងអ្នកទទួល (Address)" class="w-full border rounded px-3 py-1.5 text-xs"></textarea>
                    
                    <select id="shipping-option" onchange="updateCartUI()" class="w-full border rounded px-3 py-1.5 text-xs">
                        <option value="express">ដឹកជញ្ជូនដល់ទីកន្លែង (+ $2.00)</option>
                        <option value="store">មកយកហាងផ្ទាល់ (ឥតគិតថ្លៃ)</option>
                    </select>
                </div>
            </div>

            <div class="border-t pt-2 mt-3">
                <div class="flex justify-between font-bold text-xs mb-2">
                    <span>សរុបទឹកប្រាក់សរុប:</span>
                    <span id="total-price" class="text-indigo-600">$0.00</span>
                </div>
                <button onclick="startCheckoutProcess()" id="checkout-btn" class="w-full bg-green-600 text-white py-2 rounded font-semibold text-xs hover:bg-green-700">
                    បង់ប្រាក់តាម ABA KHQR
                </button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentTranId = null;
        let products = [];
        let cart = [];

        async function fetchProducts() {
            try {
                let response = await fetch('https://fafa-backend.onrender.com/api/products');
                products = await response.json();
                renderProducts();
            } catch (err) {
                console.error("Error fetching products:", err);
                document.getElementById('product-grid').innerHTML = '<p class="text-xs text-red-500 col-span-2 text-center">បរាជ័យក្នុងការទាញយកទំនិញពី Server</p>';
            }
        }

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="bg-white rounded-lg shadow-sm overflow-hidden border flex flex-col justify-between">
                    <img src="${p.image}" class="w-full h-32 object-cover cursor-pointer hover:opacity-90 transition" onclick="openImageModal('${p.image}')">
                    <div class="p-2 flex flex-col justify-between flex-grow">
                        <h3 class="text-xs font-medium">${p.name}</h3>
                        <p class="text-indigo-600 font-bold text-xs mt-1">$${p.price.toFixed(2)}</p>
                        <div class="text-[10px] mt-1 mb-1">
                            ${p.stock > 0 ? `<span class="text-gray-500">ស្តុក: <strong class="text-green-600">${p.stock}</strong></span>` : `<span class="text-red-500 font-bold">អស់ស្តុក</span>`}
                        </div>
                        <button onclick="addToCart(${p.id})" class="py-1 rounded text-[10px] font-semibold ${p.stock > 0 ? 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}" ${p.stock === 0 ? 'disabled' : ''}>
                            ${p.stock > 0 ? 'បញ្ជូលក្នុងកន្ត្រក' : 'អស់ស្តុក'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            let p = products.find(item => item.id === id);
            if (!p || p.stock <= 0) return;
            let exist = cart.find(item => item.id === id);
            if (exist && exist.quantity >= p.stock) {
                alert('⚠️ លើសចំនួនស្តុកដែលមាន!');
                return;
            }
            if (exist) exist.quantity++;
            else cart.push({ ...p, quantity: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.quantity, 0);
            let container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center text-xs py-2">កន្ត្រកទទេ</p>';
                document.getElementById('total-price').innerText = '$0.00';
                return;
            }
            container.innerHTML = cart.map(i => `
                <div class="flex justify-between items-center bg-gray-50 p-1.5 rounded text-xs">
                    <span>${i.name} ($${i.price}x${i.quantity})</span>
                    <button onclick="removeItem(${i.id})" class="text-red-500 font-bold">លុប</button>
                </div>
            `).join('');

            let subtotal = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            let shipping = document.getElementById('shipping-option').value === 'express' ? 2.00 : 0.00;
            document.getElementById('total-price').innerText = `$${(subtotal + shipping).toFixed(2)}`;
        }

        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            updateCartUI();
        }

        async function startCheckoutProcess() {
            if (cart.length === 0) { alert('សូមជ្រើសរើសទំនិញ!'); return; }
            let phone = document.getElementById('cus-phone').value.trim();
            let address = document.getElementById('cus-address').value.trim();
            if (!phone || !address) { alert('សូមបំពេញលេខទូរសព្ទ និងទីតាំងរបស់អ្នក!'); return; }

            let subtotal = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            let shippingFee = document.getElementById('shipping-option').value === 'express' ? 2.00 : 0.00;
            let totalAmount = (subtotal + shippingFee).toFixed(2);
            let orderId = 'FAFA-' + Date.now();

            let btn = document.getElementById('checkout-btn');
            btn.innerText = "កំពុងរៀបចំ QR...";
            btn.disabled = true;

            try {
                let response = await fetch('https://fafa-backend.onrender.com/api/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId, amount: totalAmount, phone, address, shippingFee, cart
                    })
                });

                let result = await response.json();

                if (result.success) {
                    currentTranId = result.tran_id;
                    document.getElementById('qr-amount').innerText = `$${totalAmount}`;
                    
                    // 🟢 ត្រង់នេះគឺយករូបភាព QR របស់អ្នកមកបង្ហាញស្រាប់ (មិនបាច់ generate ទៀតទេ)
                    // document.getElementById('qr-image-tag').src = "LINK_រូបភាព_QR_របស់អ្នក.jpg";

                    document.getElementById('qr-modal').classList.remove('hidden');
                    toggleCart();
                } else {
                    alert('បរាជ័យក្នុងការបង្កើតការបញ្ជាទិញ!');
                }
            } catch (err) {
                console.error(err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ Server!');
            } finally {
                btn.innerText = "បង់ប្រាក់តាម ABA KHQR";
                btn.disabled = false;
            }
        }

        async function confirmPayment() {
            let btn = document.getElementById('confirm-pay-btn');
            btn.innerText = "កំពុងបញ្ជូនព័ត៌មាន...";
            btn.disabled = true;

            try {
                let response = await fetch('https://fafa-backend.onrender.com/api/confirm-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tran_id: currentTranId })
                });

                let result = await response.json();
                if (result.success) {
                    products = result.products; 
                    renderProducts(); 
                    cart = []; 

                    alert('🎉 ការបញ្ជាទិញជោគជ័យ! ស្តុកត្រូវបានកាត់បន្ថយលើប្រព័ន្ធ Server រួចរាល់។');
                    closeQrModal();
                    updateCartUI();
                } else {
                    alert('មានបញ្ហាបញ្ជាក់ការទូទាត់!');
                    btn.innerText = "បានបង់ប្រាក់រួចរាល់ (បញ្ជាក់ការបញ្ជាទិញ)";
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('កំហុសក្នុងការតភ្ជាប់ Server!');
                btn.innerText = "បានបង់ប្រាក់រួចរាល់ (បញ្ជាក់ការបញ្ជាទិញ)";
                btn.disabled = false;
            }
        }

        function closeQrModal() {
            document.getElementById('qr-modal').classList.add('hidden');
        }

        function openImageModal(imgSrc) {
            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        fetchProducts();
    </script>
</body>
</html>
